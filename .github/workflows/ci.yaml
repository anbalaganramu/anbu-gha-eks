name: Kubernetes CI

on: 
  push:
    branches:
      - feature/v1

jobs:
  pyapp-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures all history is fetched for pushing changes back

      - name: Build Docker Image
        run: "docker build -t anbumca05/gha-app:${GITHUB_SHA::7} ."

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASSWORD }}"

      - name: Push Docker Image
        run: "docker push anbumca05/gha-app:${GITHUB_SHA::7}"

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update deployment.yml with latest docker tag
        run: |
          # Short commit hash
          SHORT_SHA=${GITHUB_SHA::7}
          # Update image tag in deployment.yaml
          yq -i '.spec.template.spec.containers[0].image = "anbumca05/gha-app:'"$SHORT_SHA"'"' ./k8s/pyapp-deployment.yaml
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Find the file regardless of where it is (k8s/ or root)
          # Replace 'py-deployment.yaml' with a pattern that matches your file
          FILE_PATH=$(find . -name "py-deployment.yaml" -o -name "pyapp-deployment.yml" | head -n 1)
          
          if [ -z "$FILE_PATH" ]; then
            echo "Error: Deployment file not found!"
            exit 1
          fi

          git add "$FILE_PATH"
          
          # Only commit if there are changes to avoid errors
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update image tag to ${GITHUB_SHA::7} [skip ci]"
            git push
          fi
