name: Kubernetes CI

on: 
  push:
    branches:
      - feature/v1

jobs:
  pyapp-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures all history is fetched for pushing changes back

      - name: Build Docker Image
        run: "docker build -t anbumca05/gha-app:${GITHUB_SHA::7} ."

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASSWORD }}"

      - name: Push Docker Image
        run: "docker push anbumca05/gha-app:${GITHUB_SHA::7}"

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update deployment.yaml with latest docker tag
        run: |
          # Short commit hash
          SHORT_SHA=${GITHUB_SHA::7}
          # Update image tag in deployment.yaml
          yq -i '.spec.template.spec.containers[0].image = "anbumca05/gha-pyapp:'"$SHORT_SHA"'"' ./k8s/pyapp-deployment.yaml
      - name: Commit deployment file changes
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions@noreply"
            git add k8s/pyapp-deployment.yaml
            git commit -m 'docker tag updated by GHA' || echo "Already commited changes"
            git push origin feature/v1
