name: Kubernetes CI

on: 
  push:
    branches:
      - feature/v1

jobs:
  pyapp-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures all history is fetched for pushing changes back

      - name: Build Docker Image
        run: "docker build -t anbumca05/gha-app:${GITHUB_SHA::7} ."

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASSWORD }}"

      - name: Push Docker Image
        run: "docker push anbumca05/gha-app:${GITHUB_SHA::7}"

      - name: Install yq
        uses: mikefarah/yq@v4.44.3

      - name: Update deployment.yml with latest docker tag
        run: |
          # Short commit hash
          SHORT_SHA=${GITHUB_SHA::7}
          # Update image tag in deployment.yaml
          yq -i '.spec.template.spec.containers[0].image = "anbumca05/gha-pyapp:'"$SHORT_SHA"'"' ./k8s/pyapp-deployment.yaml
      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/pyapp-deployment.yaml
          
          # Only commit if there are actual changes to avoid "nothing to commit" errors
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update docker tag to ${GITHUB_SHA::7} [skip ci]"
            # Use GITHUB_REF_NAME to push to the current branch (feature/v1)
            git push origin ${GITHUB_REF_NAME}
          fi
